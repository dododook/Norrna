<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>初始化 - NORRNA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        (function () {
            try {
                var t = localStorage.getItem('norrna-theme');
                if (t !== 'dark' && t !== 'light') t = 'dark';
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <script type="x-shader/x-vertex" id="avs">#version 300 es
in vec2 position;
void main() { gl_Position = vec4(position, 0.0, 1.0); }
</script>
    <script type="x-shader/x-fragment" id="afs">#version 300 es
precision highp float;
uniform float uTime;
uniform float uAmplitude;
uniform vec3 uColorStops[3];
uniform vec2 uResolution;
uniform float uBlend;
out vec4 fragColor;
vec3 permute(vec3 x) { return mod(((x * 34.0) + 1.0) * x, 289.0); }
float snoise(vec2 v){
  const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
  vec2 i  = floor(v + dot(v, C.yy));
  vec2 x0 = v - i + dot(i, C.xx);
  vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
  vec4 x12 = x0.xyxy + C.xxzz;
  x12.xy -= i1;
  i = mod(i, 289.0);
  vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));
  vec3 m = max(0.5 - vec3(dot(x0, x0), dot(x12.xy, x12.xy), dot(x12.zw, x12.zw)), 0.0);
  m = m * m; m = m * m;
  vec3 x = 2.0 * fract(p * C.www) - 1.0;
  vec3 h = abs(x) - 0.5;
  vec3 ox = floor(x + 0.5);
  vec3 a0 = x - ox;
  m *= 1.79284291400159 - 0.85373472095314 * (a0*a0 + h*h);
  vec3 g;
  g.x  = a0.x  * x0.x  + h.x  * x0.y;
  g.yz = a0.yz * x12.xz + h.yz * x12.yw;
  return 130.0 * dot(m, g);
}
struct ColorStop { vec3 color; float position; };
void main() {
  vec2 uv = gl_FragCoord.xy / uResolution;
  ColorStop colors[3];
  colors[0] = ColorStop(uColorStops[0], 0.0);
  colors[1] = ColorStop(uColorStops[1], 0.5);
  colors[2] = ColorStop(uColorStops[2], 1.0);
  int index = 0;
  for (int i = 0; i < 2; i++) {
    bool isInBetween = colors[i].position <= uv.x;
    index = int(mix(float(index), float(i), float(isInBetween)));
  }
  float range = colors[index + 1].position - colors[index].position;
  float lerpFactor = (uv.x - colors[index].position) / range;
  vec3 rampColor = mix(colors[index].color, colors[index + 1].color, lerpFactor);
  float height = snoise(vec2(uv.x * 2.0 + uTime * 0.1, uTime * 0.25)) * 0.5 * uAmplitude;
  height = exp(height);
  height = (uv.y * 2.0 - height + 0.2);
  float intensity = 0.6 * height;
  float midPoint = 0.20;
  float auroraAlpha = smoothstep(midPoint - uBlend * 0.5, midPoint + uBlend * 0.5, intensity);
  vec3 auroraColor = intensity * rampColor;
  fragColor = vec4(auroraColor * auroraAlpha, auroraAlpha);
}
</script>
    <style>
        :root {
            color-scheme: light;
            --primary: #171717;
            --primary-hover: #262626;
            --on-primary: #ffffff;
            --text-dark: #1a202c;
            --text-gray: #718096;
            --bg-body: #fafafa;
            --bg-card: #ffffff;
            --bg-muted: #f8fafc;
            --border-color: #e2e8f0;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --danger-bg: #fef2f2;
            --success-bg: #ecfdf5;
            --input-bg: #fff;
            --focus-ring: rgba(23, 23, 23, 0.1);
            --meter-track: #edf2f7;
        }
        html[data-theme="dark"] {
            color-scheme: dark;
            --primary: #f5f4f0;
            --primary-hover: #ffffff;
            --on-primary: #080808;
            --text-dark: #f5f4f0;
            --text-gray: rgba(245, 244, 240, 0.62);
            --bg-body: #050505;
            --bg-card: rgba(255, 255, 255, 0.045);
            --bg-muted: rgba(255, 255, 255, 0.04);
            --border-color: rgba(255, 255, 255, 0.09);
            --danger: #f87171;
            --success: #34d399;
            --warning: #fbbf24;
            --danger-bg: rgba(248, 113, 113, 0.14);
            --success-bg: rgba(52, 211, 153, 0.14);
            --input-bg: rgba(255, 255, 255, 0.04);
            --focus-ring: rgba(107, 142, 245, 0.25);
            --meter-track: rgba(255, 255, 255, 0.12);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-body);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-dark);
        }
        html[data-theme="dark"] body {
            font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
        }
        #aurora {
            display: none;
            position: fixed; top: 0; left: 0; z-index: 0;
            width: 100%; height: 70vh; opacity: .4; pointer-events: none;
        }
        html[data-theme="dark"] #aurora { display: block; }
        .theme-grain {
            display: none;
        }
        html[data-theme="dark"] .theme-grain {
            display: block;
            position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0.04;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
            background-size: 180px 180px;
        }
        #spark { position: fixed; inset: 0; z-index: 99999; pointer-events: none; }
        .theme-toggle {
            position: fixed; top: 20px; right: 20px; z-index: 2;
            width: 36px; height: 36px; padding: 0; border-radius: 8px; cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center;
            line-height: 0; font-size: 0;
            background: var(--bg-card); color: var(--text-dark);
            border: 1px solid var(--border-color);
        }
        .theme-toggle svg {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 18px;
            height: 18px;
            margin: 0;
            transform: translate(-50%, -50%);
            display: none;
        }
        html:not([data-theme="dark"]) .theme-toggle .icon-sun { display: block; }
        html[data-theme="dark"] .theme-toggle .icon-moon { display: block; }

        .setup-card {
            position: relative; z-index: 1;
            background: var(--bg-card);
            width: 100%;
            max-width: 560px;
            padding: 36px 40px 32px;
            border-radius: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border: 1px solid var(--border-color);
        }
        html[data-theme="dark"] .setup-card {
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow: 0 24px 70px rgba(0,0,0,.4);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 1.5em;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .header p {
            color: var(--text-gray);
            font-size: 0.9em;
        }

        .info-tip {
            background: var(--bg-muted);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 24px;
            font-size: 0.85em;
            color: var(--text-gray);
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85em;
            font-weight: 600;
            color: var(--text-dark);
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            background: var(--input-bg);
            color: var(--text-dark);
            transition: all 0.2s;
        }

        .form-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--focus-ring);
        }

        .password-meter {
            height: 3px;
            background: var(--meter-track);
            margin-top: 8px;
            border-radius: 2px;
            overflow: hidden;
            display: flex;
        }

        .password-meter div {
            height: 100%;
            width: 0;
            transition: width 0.3s, background-color 0.3s;
        }

        .meter-weak { width: 33% !important; background-color: var(--danger) !important; }
        .meter-medium { width: 66% !important; background-color: var(--warning) !important; }
        .meter-strong { width: 100% !important; background-color: var(--success) !important; }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: var(--on-primary);
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: var(--primary-hover);
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .message {
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85em;
            margin-bottom: 20px;
            display: none;
            text-align: center;
        }

        .message.error { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--border-color); }
        .message.success { background: var(--success-bg); color: var(--success); border: 1px solid var(--border-color); }

        .spinner {
            border: 2px solid var(--border-color);
            border-top: 2px solid var(--primary);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 0.8s linear infinite;
            margin: 10px auto 0;
            display: none;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .brand-mark {
            width: 56px; height: 56px; margin: 0 auto 12px;
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #6b8ef5, #a78bfa);
            color: #fff; font-weight: 800; font-size: 22px; letter-spacing: -1px;
        }
        .steps {
            display: flex; align-items: center; gap: 0; margin: 8px 0 28px;
        }
        .steps li {
            display: flex; align-items: center; list-style: none; flex: 1;
        }
        .steps li:last-child { flex: 0; }
        .step-num {
            width: 28px; height: 28px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 700; flex-shrink: 0;
            background: var(--bg-muted); color: var(--text-gray);
        }
        .steps li.active .step-num,
        .steps li.done .step-num {
            background: var(--primary); color: var(--on-primary);
        }
        .steps li.active .step-num { box-shadow: 0 0 0 4px var(--focus-ring); }
        .step-label {
            font-size: 13px; font-weight: 600; margin-left: 8px; white-space: nowrap;
            color: var(--text-faint, var(--text-gray));
        }
        .steps li.active .step-label,
        .steps li.done .step-label { color: var(--text-dark); }
        .step-line {
            height: 1px; flex: 1; margin: 0 10px; background: var(--border-color);
        }
        .steps li.done + li .step-line,
        .steps li.done .step-line { background: var(--primary); }
        .step-pane { display: none; }
        .step-pane.active { display: block; animation: rise .28s ease; }
        @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
        .step-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
        .step-desc { font-size: 13px; color: var(--text-gray); margin-bottom: 22px; line-height: 1.6; }
        .theme-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
        .theme-opt {
            border: 2px solid var(--border-color); background: var(--bg-muted);
            border-radius: 14px; padding: 18px 12px; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; gap: 8px;
            color: var(--text-gray); font-size: 13px; font-weight: 600;
        }
        .theme-opt.active { border-color: var(--primary); color: var(--text-dark); background: var(--bg-card); }
        .theme-opt svg { width: 28px; height: 28px; }
        .input-wrap { position: relative; }
        .toggle-eye {
            position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
            background: none; border: none; cursor: pointer; color: var(--text-gray);
            padding: 4px; display: flex;
        }
        .toggle-eye svg { width: 18px; height: 18px; }
        .ack {
            display: flex; align-items: flex-start; gap: 10px;
            font-size: 13px; color: var(--text-gray); line-height: 1.45; margin: 8px 0 18px;
        }
        .ack input { margin-top: 3px; }
        .wizard-nav { display: flex; gap: 10px; margin-top: 8px; }
        .btn-ghost {
            flex: 1; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px;
            background: var(--bg-muted); color: var(--text-dark); border: 1px solid var(--border-color);
        }
        .btn-submit { flex: 1; margin-top: 0; }
        .feature-list { display: grid; gap: 10px; margin-bottom: 24px; }
        .feature-list div {
            display: flex; gap: 10px; align-items: flex-start;
            font-size: 13px; color: var(--text-gray); line-height: 1.45;
        }
        .feature-list strong { color: var(--text-dark); }
        .dot-ok { width: 8px; height: 8px; border-radius: 50%; background: var(--success); margin-top: 6px; flex-shrink: 0; }
        body.setup-done .setup-card,
        body.setup-done .theme-toggle { display: none; }
        .countdown-overlay {
            display: none; position: fixed; inset: 0; z-index: 100;
            background: var(--bg-body); align-items: center; justify-content: center;
        }
        .countdown-overlay.active { display: flex; }
        .countdown-card {
            position: relative; z-index: 1;
            background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 20px; padding: 36px 40px; text-align: center;
            min-width: 280px; max-width: 420px; width: calc(100% - 40px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
        html[data-theme="dark"] .countdown-card {
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow: 0 24px 70px rgba(0,0,0,.4);
        }
        .countdown-card h2 { margin-bottom: 8px; }
        .countdown-card p { color: var(--text-gray); font-size: 14px; }
        .countdown-num { font-size: 42px; font-weight: 800; margin: 12px 0 4px; color: var(--primary); }
        @media (max-width: 560px) {
            .step-label { display: none; }
            .setup-card { padding: 28px 20px; }
        }
    </style>
</head>
<body>
    <canvas id="aurora" aria-hidden="true"></canvas>
    <div class="theme-grain" aria-hidden="true"></div>
    <canvas id="spark" aria-hidden="true"></canvas>
    <button type="button" class="theme-toggle" id="themeToggleBtn" onclick="toggleTheme()" title="切换到深色" aria-label="切换主题">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"></path>
        </svg>
    </button>
    <div class="setup-card">
        <div class="header">
            <div class="brand-mark">N</div>
            <h1>Norrna</h1>
            <p>首次启动向导</p>
        </div>

        <ol class="steps" id="stepper">
            <li class="active" data-step="1"><span class="step-num">1</span><span class="step-label">欢迎</span><span class="step-line"></span></li>
            <li data-step="2"><span class="step-num">2</span><span class="step-label">管理员</span><span class="step-line"></span></li>
            <li data-step="3"><span class="step-num">3</span><span class="step-label">完成</span></li>
        </ol>

        <div id="errorMessage" class="message error"></div>

        <div class="step-pane active" id="step1">
            <div class="step-title">欢迎使用 Norrna</div>
            <div class="step-desc">轻量转发面板：用 Web 管多台 Agent，普通 TCP/UDP 走官方 Realm。</div>
            <div class="feature-list">
                <div><span class="dot-ok"></span><span><strong>一键部署节点</strong>，复制命令即可安装 Agent 和 Realm</span></div>
                <div><span class="dot-ok"></span><span><strong>拨测与解锁</strong>，看延迟和落地出口能力</span></div>
                <div><span class="dot-ok"></span><span><strong>网页更新</strong>，面板、节点、内核都能在线升级</span></div>
            </div>
            <div class="step-desc" style="margin-bottom:10px;">先选一个主题，之后随时可改。</div>
            <div class="theme-grid">
                <button type="button" class="theme-opt" id="optLight" onclick="pickTheme('light')">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 18a6 6 0 1 0 0-12 6 6 0 0 0 0 12zM11 1v3h2V1h-2zm0 19v3h2v-3h-2zM4.22 4.22l2.12 2.12 1.42-1.42L5.64 2.8 4.22 4.22zM16.24 16.24l2.12 2.12 1.42-1.42-2.12-2.12-1.42 1.42zM1 11h3v2H1v-2zm19 0h3v2h-3v-2zM4.22 19.78l1.42 1.42 2.12-2.12-1.42-1.42-2.12 2.12zM16.24 7.76l1.42 1.42 2.12-2.12-1.42-1.42-2.12 2.12z"/></svg>
                    浅色
                </button>
                <button type="button" class="theme-opt" id="optDark" onclick="pickTheme('dark')">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.1 2a.75.75 0 0 1 .64 1.16A8 8 0 0 0 21.7 14.1a.75.75 0 0 1 .84.91A10 10 0 1 1 12.1 2z"/></svg>
                    深色
                </button>
            </div>
            <button type="button" class="btn-submit" onclick="goStep(2)">下一步</button>
        </div>

        <div class="step-pane" id="step2">
            <div class="step-title">创建管理员</div>
            <div class="step-desc">这是登录面板的唯一管理员账号，密码至少 6 位，请妥善保管。</div>
            <form id="setupForm">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" name="username" required minlength="3" placeholder="至少 3 个字符，建议 admin" autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <div class="input-wrap">
                        <input type="password" id="password" name="password" required minlength="6" placeholder="至少 6 个字符" autocomplete="new-password" style="padding-right:40px;">
                        <button type="button" class="toggle-eye" onclick="togglePw('password', this)" aria-label="显示密码">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                    <div class="password-meter"><div id="passwordStrength"></div></div>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">确认密码</label>
                    <div class="input-wrap">
                        <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6" placeholder="再输入一次" autocomplete="new-password" style="padding-right:40px;">
                        <button type="button" class="toggle-eye" onclick="togglePw('confirmPassword', this)" aria-label="显示密码">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>
                <label class="ack">
                    <input type="checkbox" id="adminAck">
                    <span>我已确认用户名和密码，初始化完成后用它登录面板。</span>
                </label>
                <div class="wizard-nav">
                    <button type="button" class="btn-ghost" onclick="goStep(1)">上一步</button>
                    <button type="submit" class="btn-submit" id="setupBtn">创建并完成</button>
                </div>
                <div class="spinner" id="spinner"></div>
            </form>
        </div>
    </div>

    <div class="countdown-overlay" id="doneOverlay">
        <div class="countdown-card">
            <h2>初始化完成</h2>
            <div class="countdown-num" id="countdownNum">5</div>
            <p>即将进入登录页</p>
        </div>
    </div>

    <script>
        function currentTheme() {
            return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
        }
        function applyTheme(theme) {
            const t = theme === 'dark' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', t);
            try { localStorage.setItem('norrna-theme', t); } catch (e) {}
            const btn = document.getElementById('themeToggleBtn');
            if (btn) btn.title = t === 'dark' ? '切换到浅色' : '切换到深色';
        }
        function toggleTheme() {
            applyTheme(currentTheme() === 'dark' ? 'light' : 'dark');
        }
        applyTheme(currentTheme());
        syncThemeOpts();

        function pickTheme(t) {
            applyTheme(t);
            syncThemeOpts();
        }
        function syncThemeOpts() {
            const dark = currentTheme() === 'dark';
            document.getElementById('optDark').classList.toggle('active', dark);
            document.getElementById('optLight').classList.toggle('active', !dark);
        }
        function goStep(n) {
            document.querySelectorAll('.step-pane').forEach(p => p.classList.remove('active'));
            const pane = document.getElementById('step' + n);
            if (pane) pane.classList.add('active');
            document.querySelectorAll('#stepper li').forEach(li => {
                const s = parseInt(li.dataset.step, 10);
                li.classList.toggle('active', s === n);
                li.classList.toggle('done', s < n);
            });
            hideError();
        }
        function togglePw(id, btn) {
            const input = document.getElementById(id);
            const show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            btn.innerHTML = show
                ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
                : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
        }

        const form = document.getElementById('setupForm');
        const setupBtn = document.getElementById('setupBtn');
        const spinner = document.getElementById('spinner');
        const errorMessage = document.getElementById('errorMessage');
        const passwordInput = document.getElementById('password');
        const passwordStrength = document.getElementById('passwordStrength');

        checkSetupStatus();

        async function checkSetupStatus() {
            try {
                const response = await fetch('/api/auth/check-setup');
                const result = await response.json();
                if (result.success && !result.needs_setup) {
                    window.location.href = '/login';
                }
            } catch (error) {}
        }

        passwordInput.addEventListener('input', () => {
            const password = passwordInput.value;
            let strength = 0;
            if (password.length >= 6) strength++;
            if (password.length >= 10) strength++;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
            if (/\d/.test(password)) strength++;
            if (/[^a-zA-Z0-9]/.test(password)) strength++;
            passwordStrength.className = '';
            if (strength >= 4) passwordStrength.className = 'meter-strong';
            else if (strength >= 2) passwordStrength.className = 'meter-medium';
            else if (strength >= 1) passwordStrength.className = 'meter-weak';
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            hideError();
            if (username.length < 3) return showError('用户名至少需要 3 个字符');
            if (password.length < 6) return showError('密码至少需要 6 位');
            if (password !== confirmPassword) return showError('两次输入的密码不一致');
            if (!document.getElementById('adminAck').checked) return showError('请勾选确认后再创建');

            setupBtn.disabled = true;
            spinner.style.display = 'block';
            try {
                const response = await fetch('/api/auth/setup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                });
                const result = await response.json();
                if (result.success) {
                    spinner.style.display = 'none';
                    startCountdown();
                } else {
                    showError(result.message || '创建失败，请重试');
                }
            } catch (error) {
                showError('网络错误: ' + error.message);
            }
        });

        function hideError() { errorMessage.style.display = 'none'; }
        function showError(msg) {
            errorMessage.textContent = msg;
            errorMessage.style.display = 'block';
            setupBtn.disabled = false;
            spinner.style.display = 'none';
        }
        function startCountdown() {
            document.body.classList.add('setup-done');
            const overlay = document.getElementById('doneOverlay');
            overlay.classList.add('active');
            let n = 5;
            const el = document.getElementById('countdownNum');
            el.textContent = n;
            const t = setInterval(() => {
                n -= 1;
                el.textContent = n;
                if (n <= 0) {
                    clearInterval(t);
                    window.location.href = '/login';
                }
            }, 1000);
        }
    </script>
    <script>
        (function () {
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            var cv = document.getElementById('spark');
            if (!cv) return;
            var ctx = cv.getContext('2d');
            if (!ctx) return;
            var sparks = [], DUR = 500, R = 28, SZ = 12, N = 8, raf = 0;
            function resize() { cv.width = window.innerWidth; cv.height = window.innerHeight; }
            window.addEventListener('resize', resize);
            resize();
            function ease(t) { return t * (2 - t); }
            function draw(ts) {
                ctx.clearRect(0, 0, cv.width, cv.height);
                var dark = document.documentElement.getAttribute('data-theme') === 'dark';
                sparks = sparks.filter(function (s) {
                    var e = ts - s.start;
                    if (e >= DUR) return false;
                    var p = ease(e / DUR), d = p * R, l = SZ * (1 - p), a = (1 - p) * 0.9;
                    ctx.strokeStyle = dark ? 'rgba(255,255,255,' + a + ')' : 'rgba(23,23,23,' + a + ')';
                    ctx.lineWidth = 1.8;
                    ctx.beginPath();
                    ctx.moveTo(s.x + d * Math.cos(s.a), s.y + d * Math.sin(s.a));
                    ctx.lineTo(s.x + (d + l) * Math.cos(s.a), s.y + (d + l) * Math.sin(s.a));
                    ctx.stroke();
                    return true;
                });
                raf = sparks.length ? requestAnimationFrame(draw) : 0;
            }
            window.addEventListener('click', function (e) {
                var now = performance.now();
                for (var i = 0; i < N; i++) sparks.push({ x: e.clientX, y: e.clientY, a: (2 * Math.PI * i) / N, start: now });
                if (!raf) raf = requestAnimationFrame(draw);
            });
        })();
        (function () {
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            var cv = document.getElementById('aurora');
            if (!cv) return;
            var gl = cv.getContext('webgl2', { alpha: true, antialias: true, premultipliedAlpha: true });
            if (!gl) { cv.style.display = 'none'; return; }
            function sh(t, s) { var x = gl.createShader(t); gl.shaderSource(x, s); gl.compileShader(x); return x; }
            var vs = document.getElementById('avs'), fs = document.getElementById('afs');
            if (!vs || !fs) return;
            var pr = gl.createProgram();
            gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs.textContent.trim()));
            gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs.textContent.trim()));
            gl.linkProgram(pr);
            if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) { cv.style.display = 'none'; return; }
            gl.useProgram(pr);
            gl.clearColor(0, 0, 0, 0);
            gl.enable(gl.BLEND);
            gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
            var buf = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, buf);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
            var loc = gl.getAttribLocation(pr, 'position');
            gl.enableVertexAttribArray(loc);
            gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
            var uTime = gl.getUniformLocation(pr, 'uTime');
            var uRes = gl.getUniformLocation(pr, 'uResolution');
            var uAmp = gl.getUniformLocation(pr, 'uAmplitude');
            var uBlendU = gl.getUniformLocation(pr, 'uBlend');
            var uStops = gl.getUniformLocation(pr, 'uColorStops');
            gl.uniform1f(uAmp, 1.0);
            gl.uniform1f(uBlendU, 0.5);
            gl.uniform3fv(uStops, new Float32Array([0.40, 0.40, 0.44, 0.92, 0.92, 0.94, 0.40, 0.40, 0.44]));
            var dpr = Math.min(window.devicePixelRatio || 1, 2);
            function resize() {
                var w = Math.max(1, Math.floor(cv.clientWidth * dpr));
                var h = Math.max(1, Math.floor(cv.clientHeight * dpr));
                cv.width = w; cv.height = h;
                gl.viewport(0, 0, w, h);
                gl.uniform2f(uRes, w, h);
            }
            window.addEventListener('resize', resize);
            var raf = 0;
            function loop(t) {
                gl.uniform1f(uTime, t * 0.001);
                gl.clear(gl.COLOR_BUFFER_BIT);
                gl.drawArrays(gl.TRIANGLES, 0, 3);
                raf = requestAnimationFrame(loop);
            }
            function start() { if (!raf) { resize(); raf = requestAnimationFrame(loop); } }
            function stop() { if (raf) { cancelAnimationFrame(raf); raf = 0; } }
            function sync() {
                var on = document.documentElement.getAttribute('data-theme') === 'dark' && !document.hidden;
                if (on) start(); else stop();
            }
            document.addEventListener('visibilitychange', sync);
            new MutationObserver(sync).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
            sync();
        })();
    </script>
