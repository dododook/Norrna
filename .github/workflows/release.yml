name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  linux-amd64:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --workspace
      - name: Fetch official Realm
        run: |
          set -e
          curl -fL --retry 5 -o realm.tar.gz \
            https://github.com/zhboner/realm/releases/download/v2.9.6/realm-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf realm.tar.gz
          chmod +x realm
          ./realm -v || ./realm --version
      - name: Upload binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v0.0.{0}', github.run_number) }}
          files: |
            target/release/norrna
            target/release/norrna-manager
            realm
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
